[project]
name = "tokenizer-lit-rag"
version = "0.1.0"
description = "Talk to the literature: a RAG chatbot over LLM tokenizer research"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.13",
    "datasketch>=2.0.0",
    "feedparser>=6.0.14",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pymupdf4llm>=1.28.2",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
